# Closes the issues of a pull request as soon as it is merged into develop.
# GitHub itself only closes issues named with "Closes #n" when the pull request goes into the
# default branch (main). Our feature branches are merged into develop, so this is done here.
# Closing the issue lets the project board's built-in workflow "Item closed" set it to "Done".
name: Close issues merged into develop

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ''}`;
            // The closing keywords GitHub knows: close(s/d), fix(es/ed), resolve(s/d).
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = new Set([...text.matchAll(keyword)].map((m) => Number(m[1])));
            for (const number of numbers) {
              const { data: issue } = await github.rest.issues.get({
                ...context.repo, issue_number: number });
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.createComment({
                ...context.repo, issue_number: number,
                body: `Mit #${pr.number} nach \`develop\` gemergt.` });
              await github.rest.issues.update({
                ...context.repo, issue_number: number,
                state: 'closed', state_reason: 'completed' });
              core.info(`Issue #${number} geschlossen`);
            }
            if (!numbers.size) core.info('Keine "Closes #n"-Angabe im Pull Request');
